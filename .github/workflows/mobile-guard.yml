name: Mobile layout guard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .jm/guard.py
      - run: |
          if ! git diff --quiet; then
            git config user.name "mobile-guard"; git config user.email "actions@github.com"
            git commit -am "Mobile guard: re-applied phone layout CSS stripped by sync"
            git push
          fi
