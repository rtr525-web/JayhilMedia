<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jayhil Media — Empire Vault</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1015;
    color: #e5e7eb;
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image: radial-gradient(circle at 50% 20%, rgba(60, 140, 255, 0.12), transparent 60%);
  }
  .card {
    background: #17181f;
    border: 1px solid #262833;
    border-radius: 20px;
    padding: 44px 36px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 60px rgba(60, 140, 255, 0.08);
    text-align: center;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(60, 140, 255, 0.12);
    border: 1px solid rgba(60, 140, 255, 0.3);
    color: #60a5fa;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .lock-icon {
    font-size: 16px;
  }
  h1 {
    font-family: 'Archivo', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #ffffff;
    margin-bottom: 8px;
  }
  p.subtitle {
    color: #9ca3af;
    font-size: 14px;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  input[type="password"] {
    width: 100%;
    padding: 14px 18px;
    border-radius: 12px;
    border: 1px solid #2d303e;
    background: #0d0e13;
    color: #ffffff;
    font-size: 16px;
    outline: none;
    transition: all 0.2s;
  }
  input[type="password"]:focus {
    border-color: #3c8cff;
    box-shadow: 0 0 0 3px rgba(60, 140, 255, 0.25);
  }
  .remember {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
    color: #9ca3af;
    cursor: pointer;
  }
  .remember input {
    accent-color: #3c8cff;
  }
  button {
    padding: 14px 20px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #3c8cff, #2563eb);
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
  }
  button:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
  }
  .err {
    color: #f87171;
    font-size: 13px;
    margin-top: 10px;
    display: none;
  }
  .shake {
    animation: shake 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }
  @keyframes shake {
    10%, 90% { transform: translate3d(-2px, 0, 0); }
    20%, 80% { transform: translate3d(4px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
    40%, 60% { transform: translate3d(6px, 0, 0); }
  }
</style>
</head>

<div class="card" id="card">

  <h1>Empire Hub</h1>

  <form id="vaultForm" onsubmit="unlock(event)">
    <input type="password" id="pw" placeholder="Enter vault password" autocomplete="current-password" autofocus required>
    <label class="remember">
      <input type="checkbox" id="remember" checked> Remember on this device
    </label>
    <button type="submit" id="btn">Unlock Empire Hub</button>
    <div class="err" id="err">Incorrect password. Please try again.</div>
  </form>
</div>

function b64ToBuf(b64) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf;
}

async function decrypt(pass) {
  const enc = new TextEncoder();
  const salt = b64ToBuf(VAULT.salt);
  const iv = b64ToBuf(VAULT.iv);
  const rawData = b64ToBuf(VAULT.data);
  const tag = rawData.slice(0, 16);
  const cipher = rawData.slice(16);
  // Reconstruct ciphertext + tag for Web Crypto
  const combined = new Uint8Array(cipher.length + tag.length);
  combined.set(cipher, 0);
  combined.set(tag, cipher.length);

  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(pass), { name: 'PBKDF2' }, false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );

  const decrypted = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: iv, tagLength: 128 },
    key,
    combined
  );
  return new TextDecoder().decode(decrypted);
}

async function unlock(e) {
  if (e) e.preventDefault();
  const pw = document.getElementById('pw').value.trim();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  const card = document.getElementById('card');
  btn.textContent = 'Decrypting...';
  btn.disabled = true;
  err.style.display = 'none';

  try {
    const html = await decrypt(pw);
    if (document.getElementById('remember').checked) {
      try { localStorage.setItem('jayhil_vault_key', pw); } catch(ex){}
    }
    document.open();
    document.write(html);
    document.close();
  } catch (ex) {
    btn.textContent = 'Unlock Empire Hub';
    btn.disabled = false;
    err.style.display = 'block';
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
  }
}

// Auto-unlock if saved on device
window.addEventListener('DOMContentLoaded', () => {
  try {
    const saved = localStorage.getItem('jayhil_vault_key');
    if (saved) {
      document.getElementById('pw').value = saved;
      unlock();
    }
  } catch(e){}
});
</script>
